<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38383e"/>
      <stop offset="1" stop-color="#242327"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdf1ff"/>
      <stop offset="0.5" stop-color="#5fc9f5"/>
      <stop offset="1" stop-color="#2f8fd6"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="#0a0a0b"/>

  <rect x="116" y="96" width="134" height="322" rx="30" fill="url(#panel)" stroke="#454249" stroke-width="3"/>
  <rect x="262" y="104" width="134" height="322" rx="30" fill="url(#panel)" stroke="#454249" stroke-width="3"/>

  <rect x="248" y="118" width="16" height="290" rx="8" fill="url(#seam)" filter="url(#glow)"/>
</svg>
