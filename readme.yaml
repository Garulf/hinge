# readwright configuration. All keys are optional; autodetected values are shown.
# Keys: template, templates, output, strict, allow_exec, screenshots{dir,width,style}, badges,
#       badges_style, badges_custom, donate, donate_handles, related, project{...}, vars.
# Run `readwright badges` / `readwright blocks` to list badge presets and template blocks.
project:
  name: hinge
  tagline: A desktop scrcpy client that shows a Galaxy Z Fold 7 as a 3D phone
    that folds with the real one
  license: MIT
vars:
  status: >-
    First release candidate. The app connects to a phone over adb, starts
    scrcpy-server 4.1, and shows the video on a 3D model of the Fold 7 that
    folds, unfolds and turns with the real phone, flat and pixel-accurate
    straight on and 3D when you turn it by its case, with touch, keyboard, scrcpy's shortcuts, clipboard sync,
    phone audio, mirrored notifications, file drop, Wi-Fi pairing and phone
    apps in windows of their own. Releases
    are built for
    Windows (installer and portable exe) and Linux (AppImage and deb).
badges: []
