name: build

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release to attach the packages to
        type: string
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: package ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            files: |
              dist/*-setup.exe
              dist/*-portable.exe
          - os: ubuntu-latest
            platform: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run fetch-vendor -- --only ${{ matrix.platform }}
      - run: npm run build-agent
      - run: npm run build
      - run: node scripts/release-modes.mjs
      - run: npx electron-builder --${{ matrix.platform }} --publish=never
      - uses: actions/upload-artifact@v7
        with:
          name: hinge-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - if: inputs.tag
        run: gh release upload "${{ inputs.tag }}" $FILES --clobber
        env:
          FILES: ${{ matrix.files }}
          GH_TOKEN: ${{ github.token }}
