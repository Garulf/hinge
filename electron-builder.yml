appId: net.garulf.hinge
productName: hinge
directories: { output: dist }
files: ["out/**", "package.json"]
artifactName: "hinge-${version}-${os}-${arch}.${ext}"
extraResources:
  - { from: vendor/scrcpy-server-v4.1, to: vendor/scrcpy-server-v4.1 }
  - { from: LICENSE-scrcpy, to: LICENSE-scrcpy }
  - { from: THIRD_PARTY_NOTICES.md, to: THIRD_PARTY_NOTICES.md }
win:
  target: [nsis, portable]
  icon: build/icon.ico
  signAndEditExecutable: false
  extraResources: [{ from: vendor/platform-tools-win, to: vendor/platform-tools-win }]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target: [AppImage, deb]
  category: Utility
  icon: build/icon.png
  extraResources: [{ from: vendor/platform-tools-linux, to: vendor/platform-tools-linux }]
